name: Standalone Linux Agent
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-and-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck && pnpm build && pnpm test:contracts && pnpm validate:standalone
      - run: pnpm package:release && (cd release && sha256sum -c SHA256SUMS)
      - run: git diff --exit-code && git diff --check
  ubuntu-install-and-safety:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Exact userlands the installer accepts (installers/install-agent.sh validate_os_release).
        target: ['ubuntu-22.04', 'ubuntu-24.04', 'debian-13']
    # The post-dump lab case s3-fails-during-upload waits for Restic's own
    # backend retries to give up (about 20 to 35 minutes, no Restic option
    # bounds it), so the whole job needs more than the old 30 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Agent-only build context. No production services, host mounts or privileged Docker.
      - run: docker build --platform linux/amd64 --progress=plain --target validation --build-arg TARGET_OS=${{ matrix.target }} --file tests/ubuntu/Dockerfile --tag pluton-agent-validation:ci-${{ matrix.target }} .
      - run: docker build --platform linux/amd64 --progress=plain --target network-routing --build-arg TARGET_OS=${{ matrix.target }} --file tests/ubuntu/Dockerfile --tag pluton-agent-routing:ci-${{ matrix.target }} .
      # Traffic control affects this disposable container's private loopback only.
      - run: docker run --rm --network none --cap-add NET_ADMIN pluton-agent-routing:ci-${{ matrix.target }}
      - run: docker build --platform linux/amd64 --progress=plain --target runtime-upgrade --build-arg TARGET_OS=${{ matrix.target }} --file tests/ubuntu/Dockerfile --tag pluton-agent-runtime-upgrade:ci-${{ matrix.target }} .
      - run: docker build --platform linux/amd64 --progress=plain --build-arg TOOL_IMAGE=pluton-agent-validation:ci-${{ matrix.target }} --file tests/post-dump/Dockerfile --tag pluton-agent-post-dump:ci-${{ matrix.target }} .
      - shell: pwsh
        run: ./scripts/validate-post-dump.ps1 -RuntimeImage pluton-agent-post-dump:ci-${{ matrix.target }}
      # Real Server-monorepo Agent from the public Server repository at its last
      # installer commit (read-only export), then --migrate-monorepo and rollback.
      - if: matrix.target == 'ubuntu-22.04'
        shell: pwsh
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/ffigoperdana/pluton.git "$env:RUNNER_TEMP/pluton-server"
          ./scripts/validate-monorepo-migration.ps1 -MonorepoCheckout "$env:RUNNER_TEMP/pluton-server" -MonorepoCommit c187e2c3a830544d5c44663046519807c2ebc982 -UbuntuVersion 22.04
      # This workflow validates only. No release, registry, deployment or write permissions.
